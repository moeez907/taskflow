<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task – TaskFlow</title>
  <link rel="stylesheet" href="style.css">

<body>
  <nav>
    <a href="index.html">Home</a> |
    <a href="add-task.html">Add Task</a> |
    <a href="task-list.html">Task List</a> |
    <a href="task-detail.html">Task Detail</a> |

  </nav>

  <h1>Add New Task</h1>

  <form>
    <label for="title">Task Title:</label><br>
    <input type="text" id="title" name="title" placeholder="Enter task title" required><br><br>

    <label for="description">Description:</label><br>
    <textarea id="description" name="description" rows="4" placeholder="Enter task description"></textarea><br><br>

    <label for="due-date">Due Date:</label><br>
    <input type="date" id="due-date" name="due-date"><br><br>

    <label for="priority">Priority:</label><br>
    <select id="priority" name="priority">
      <option value="High">High</option>
      <option value="Medium" selected>Medium</option>
      <option value="Low">Low</option>
    </select><br><br>

    <button type="submit">Add Task</button>
  </form>
</body>
</html>
